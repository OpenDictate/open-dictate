name: Android release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Check signing configuration
        run: |
          test -n "$SIGNING_KEY"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          test -n "$STORE_PASSWORD"
      - name: Verify and assemble release
        run: ./gradlew testDebugUnitTest lintRelease assembleRelease --stacktrace
      - name: Name artifact
        run: cp app/build/outputs/apk/release/app-release.apk "OpenWhispr-${GITHUB_REF_NAME}.apk"
      - name: Generate changelog
        shell: bash
        run: |
          previous_tag="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          printf '## Что изменилось\n\n' > RELEASE_NOTES.md
          if [[ -n "$previous_tag" ]]; then
            git log --reverse --no-merges --pretty='- %s (%h)' "$previous_tag..$GITHUB_REF_NAME" >> RELEASE_NOTES.md
          else
            git log --reverse --no-merges --pretty='- %s (%h)' "$GITHUB_REF_NAME" >> RELEASE_NOTES.md
          fi
      - uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          files: OpenWhispr-${{ github.ref_name }}.apk
