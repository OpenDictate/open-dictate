name: Android release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check signing configuration
        run: |
          test -n "$SIGNING_KEY"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          test -n "$STORE_PASSWORD"
      - name: Verify and assemble release
        run: ./gradlew testReleaseUnitTest lintRelease assembleRelease --stacktrace
      - name: Name artifact
        run: cp app/build/outputs/apk/release/app-release.apk OpenWhispr-${GITHUB_REF_NAME}.apk
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: OpenWhispr-${{ github.ref_name }}.apk

